<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free Frequency VR</title>
  <!-- todas las rutas relativas (assets/, js/) parten de la carpeta del proyecto, igual que en la página -->
  <base href="../">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #14303a; font-family: Montserrat, system-ui, sans-serif; }
    .a-enter-vr-button, .a-enter-ar-button { border-radius: 999px !important; }
    #ff-loading { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(180deg, #0f2e38 0%, #1f4f5a 34%, #8f8b6c 62%, #f0b27a 82%, #f8d89e 100%);
      color: #fff; z-index: 10; text-align: center; transition: opacity .6s; }
    #ff-loading h1 { margin: 0; font-weight: 700; font-size: clamp(2.6rem, 8vw, 5.5rem); letter-spacing: -.02em; }
    #ff-loading h1 em { color: #f5b335; }
    #ff-loading p { font-weight: 600; font-style: italic; }
  </style>
  <!-- A-Frame (https://aframe.io): realidad virtual en el navegador. Trae su propio Three.js. -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- archivos ORIGINALES de la página: contenido, personajes 3D con sus gestos, escenarios, toon shader, sonidos y sintonizador -->
  <script src="js/data.js"></script>
  <script src="js/toon-shader.js"></script>
  <script src="js/characters-3d.js"></script>
  <script src="js/scenery.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/tuner.js"></script>
  <!-- versión VR -->
  <script src="vr/ui.js"></script>
  <script src="vr/vr.js"></script>
</head>
<body>
  <div id="ff-loading"><div><h1>Free <em>Frequency</em></h1><p>Cargando la experiencia en realidad virtual…</p></div></div>
  <!--
    FREE FREQUENCY · VERSIÓN VR
    Misma estructura que la página: Portada → Elige una zona → (Cauca: «¡No tengo señal!» · Cali: simulación del sismo) →
    menú de la zona con los tres objetos → recorrido de cada objeto (Objeto · Práctica · Personaje · Información) → Preparación.
    Computador: arrastra para mirar, clic para elegir, W A S D para moverte. Visor VR: botón «VR» y el gatillo del control.
  -->
  <a-scene
    ff-app
    renderer="antialias: true; colorManagement: true; maxCanvasWidth: 2560; maxCanvasHeight: 2560"
    cursor="rayOrigin: mouse; fuse: false"
    raycaster="objects: .clickable; far: 40"
    loading-screen="enabled: false"
    xr-mode-ui="enabled: true; XRMode: xr"
    webxr="optionalFeatures: local-floor, bounded-floor">
    <a-entity id="rig">
      <a-entity id="cam" camera="near: 0.05; far: 900" position="0 1.6 0" look-controls="pointerLockEnabled: false; magicWindowTrackingEnabled: false" wasd-controls="acceleration: 18"></a-entity>
      <a-entity id="hand-r" laser-controls="hand: right" raycaster="objects: .clickable; far: 40" line="color: #f5b335; opacity: 0.85"></a-entity>
      <a-entity id="hand-l" laser-controls="hand: left" raycaster="objects: .clickable; far: 40" line="color: #f5b335; opacity: 0.85"></a-entity>
    </a-entity>
    <!-- luces: las mismas de la página (llave cálida + relleno de cielo) -->
    <a-entity id="key" light="type: directional; color: #ffe2b0; intensity: 2.1" position="3 5 6"></a-entity>
    <a-entity id="fill" light="type: hemisphere; color: #cfe0ff; groundColor: #2a2230; intensity: 1.5"></a-entity>
    <a-entity id="amb" light="type: ambient; color: #ffffff; intensity: 0.45"></a-entity>
    <a-entity id="lobby"></a-entity>
    <a-entity id="world" visible="false"></a-entity>
  </a-scene>
</body>
</html>
